# No Secret data. Operator creates and labels openai-fixture before reconcile.
apiVersion: v1
kind: Namespace
metadata:
  name: telegram-pi-llm
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: telegram-pi-llm-reader
  namespace: telegram-pi-llm
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [openai-fixture]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: telegram-pi-llm-reader
  namespace: telegram-pi-llm
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: telegram-pi-llm-reader
subjects:
  - kind: ServiceAccount
    name: k8s-credential-provider
    namespace: ate-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-credential-provider-namespace-policy
  namespace: ate-system
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
data:
  namespace-policy.yaml: |
    policies:
      - atespace: telegram-pi-actor-validation
        allowedNamespaces: [telegram-pi-llm]
        secretSelector:
          matchLabels:
            telegram-pi/credential: llm
      - atespace: telegram-pi
        allowedNamespaces: [telegram-pi-llm]
        secretSelector:
          matchLabels:
            telegram-pi/credential: llm
