apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    ate.dev/api-access: "true"
    {{- include "telegram-pi.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
{{- range $name := list "gateway" "provisioner" "migration" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "telegram-pi.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
automountServiceAccountToken: false
---
{{- end }}
