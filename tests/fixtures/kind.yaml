apiVersion: v1
kind: Namespace
metadata:
  name: telegram-pi-fixtures
  labels:
    app.kubernetes.io/part-of: telegram-pi-validation
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: synthetic-api
  namespace: telegram-pi-fixtures
automountServiceAccountToken: false
---
# The signer requires the selecting Service before it issues the Pod certificate.
apiVersion: v1
kind: Service
metadata:
  name: synthetic-api
  namespace: telegram-pi-fixtures
spec:
  selector:
    app.kubernetes.io/name: synthetic-api
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: development-api
  namespace: telegram-pi-fixtures
spec:
  selector:
    app.kubernetes.io/name: synthetic-api
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-api
  namespace: telegram-pi-fixtures
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: synthetic-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthetic-api
    spec:
      serviceAccountName: synthetic-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: FIXTURE_IMAGE
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: servicedns
              mountPath: /run/servicedns.podcert.ate.dev
              readOnly: true
      volumes:
        - name: servicedns
          projected:
            defaultMode: 0440
            sources:
              - podCertificate:
                  signerName: servicedns.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
