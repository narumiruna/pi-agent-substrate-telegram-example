# Fixture-only credentials. Never use these values outside the isolated cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: telegram-pi-llm
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-fixture
  namespace: telegram-pi-llm
  labels:
    telegram-pi/credential: llm
stringData:
  api-key: fixture-injected-openai-key
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: telegram-pi-llm-reader
  namespace: telegram-pi-llm
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [openai-fixture]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: telegram-pi-llm-reader
  namespace: telegram-pi-llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: telegram-pi-llm-reader
subjects:
  - kind: ServiceAccount
    name: k8s-credential-provider
    namespace: ate-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-credential-provider-namespace-policy
  namespace: ate-system
data:
  namespace-policy.yaml: |
    policies:
      - atespace: telegram-pi-actor-validation
        allowedNamespaces: [telegram-pi-llm]
        secretSelector:
          matchLabels:
            telegram-pi/credential: llm
      - atespace: telegram-pi
        allowedNamespaces: [telegram-pi-llm]
        secretSelector:
          matchLabels:
            telegram-pi/credential: llm
