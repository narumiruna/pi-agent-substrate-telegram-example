# Disposable object check. Credentials are the upstream local RustFS fixtures.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-smoke-bucket
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: rustfs
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: platform-smoke-bucket
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-smoke-bucket
  namespace: ate-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: platform-smoke-bucket
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
          env:
            - name: AWS_ACCESS_KEY_ID
              value: rustfsadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: rustfsadmin
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ENDPOINT_URL
              value: http://rustfs.ate-system.svc:9000
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_PAGER
              value: ""
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              read -r uuid </proc/sys/kernel/random/uuid
              key="platform-smoke/$uuid"
              trap 'aws s3api delete-object --bucket ate-snapshots --key "$key" >/dev/null' EXIT
              printf 'telegram-pi isolated object probe\n' >/tmp/input
              aws s3api head-bucket --bucket ate-snapshots
              aws s3api put-object --bucket ate-snapshots --key "$key" --body /tmp/input >/dev/null
              aws s3api get-object --bucket ate-snapshots --key "$key" /tmp/output >/dev/null
              read -r expected </tmp/input
              read -r actual </tmp/output
              test "$actual" = "$expected"
              echo "RustFS disposable object put/get/compare passed: $key"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
