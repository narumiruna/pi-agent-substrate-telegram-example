apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-policy-client
  namespace: telegram-pi-policy-check
spec:
  podSelector:
    matchLabels:
      role: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: allowed
      ports:
        - protocol: TCP
          port: 8080
